# Wer hinter der Website steht, als schema.org-Person.
#
# Wird von layouts/partials/jsonld.html als Knoten mit der @id
# <Startseite>#person ausgegeben und von jeder Seite per @id referenziert.
# Die Schluessel muessen der schema.org-Schreibweise folgen (camelCase);
# @type, @id, url und image setzt das Partial selbst.
#
# sameAs ist das wichtigste Feld fuer die Suche nach dem Namen: Es sagt
# Google, welche Profile zu derselben Person gehoeren. Jedes weitere Profil
# (XING, Vereins- oder Alumni-Seite) gehoert hier hinein — und sollte
# moeglichst seinerseits auf creimann.cc zurueckverlinken.

name: "Christoph B. Reimann"
alternateName:
  - "Christoph Reimann"
  - "Christoph Bruno Reimann"
jobTitle: "Betriebswirt und Generalist"
description: "Betriebswirt und Generalist für Unternehmenskultur, Struktur und vertrauensvolle Zusammenarbeit. Verbindet Strategie, Führung und Praxis – mit Klarheit, Integrität und Menschlichkeit."

sameAs:
  - "https://www.linkedin.com/in/christoph-b-reimann-192328227/"

