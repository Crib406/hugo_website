name: Build and Deploy Hugo

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'claude/**'

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute last layout change
        run: |
          LATEST_LAYOUT_CHANGE=$(git log -1 --format=%cI -- layouts partials || echo "")
          mkdir -p data
          echo "{\"layout_lastmod\":\"$LATEST_LAYOUT_CHANGE\"}" > data/layout_lastmod.json

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          extended: true

      - name: Install Dart Sass
        run: |
          DART_SASS_VERSION="1.83.0"
          curl -sSLo /tmp/dart-sass.tar.gz "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          tar -xzf /tmp/dart-sass.tar.gz -C /tmp
          sudo mv /tmp/dart-sass /usr/local/dart-sass
          sudo ln -sf /usr/local/dart-sass/sass /usr/local/bin/dart-sass
          dart-sass --version

      - name: Load baseURL from hugo.toml
        id: load_baseurl
        run: |
          RAW=$(grep '^baseURL' hugo.toml | sed 's/baseURL = "//; s/"$//')
          CLEAN=$(echo "$RAW" | sed 's#/$##')   # trailing slash entfernen

          echo "BaseURL in hugo.toml: $CLEAN"
          echo "BASE_DOMAIN=$CLEAN" >> $GITHUB_ENV

      - name: Determine branch deployment path
        run: |
          BRANCH="${GITHUB_REF_NAME}"

          if [[ "$BRANCH" == "main" ]]; then
            echo "BASE_URL=${BASE_DOMAIN}/" >> $GITHUB_ENV
            echo "DEST_DIR=" >> $GITHUB_ENV
          else
            echo "BASE_URL=${BASE_DOMAIN}/preview/${BRANCH}/" >> $GITHUB_ENV
            echo "DEST_DIR=preview/${BRANCH}" >> $GITHUB_ENV
          fi

          echo "Deploying branch: $BRANCH"
          echo "BaseURL: ${BASE_URL}"
          echo "DEST_DIR: ${DEST_DIR}"

      - name: Build
        run: |
          hugo --minify --baseURL "${BASE_URL}"

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
          destination_dir: ${{ env.DEST_DIR }}
          keep_files: true

  # Übersicht aller Branch-Vorschauen unter /preview/ neu erzeugen.
  # Läuft nach dem Deploy, damit eine neu hinzugekommene Vorschau
  # sofort in der Liste steht.
  preview-index:
    needs: build-deploy
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages-write
      cancel-in-progress: false
    steps:
      - name: Skript holen
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          path: tools

      - name: gh-pages auschecken
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages

      - name: Übersicht schreiben
        working-directory: pages
        run: |
          chmod +x ../tools/.github/scripts/preview-tools.sh
          ../tools/.github/scripts/preview-tools.sh index

      - name: Änderungen übernehmen
        working-directory: pages
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Übersicht unverändert"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Vorschau-Übersicht aktualisiert"
          git push
