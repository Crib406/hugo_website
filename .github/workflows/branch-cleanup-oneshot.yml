name: Gemergte Branches loeschen (einmalig)

# Einmaliger Lauf. Loescht die Branches, deren Inhalt in main steht oder
# deren Aenderungen anderswo vollstaendig erhalten sind. Die Datei wird
# nach dem Lauf wieder entfernt.
on:
  push:
    branches:
      - claude/merged-branches-preview-r442sx

permissions:
  contents: write

jobs:
  loeschen:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Branches loeschen
        run: |
          set -euo pipefail

          BRANCHES="
          claude/hero-chip-entfernen
          claude/daisy-ui-integration-jkwozc
          feature/seo-quickwins
          claude/google-sitemap-crawling-s1cgcu
          claude/seo-uiux-analysis-xg30cc
          "

          REPO="${{ github.repository }}"

          for b in $BRANCHES; do
            [ -n "$b" ] || continue

            # Sicherung: geschuetzte Branches nie anfassen
            case "$b" in
              main|gh-pages|"${{ github.ref_name }}")
                echo "ABBRUCH: '$b' steht auf der Sperrliste" >&2
                exit 1
                ;;
            esac

            sha="$(gh api "repos/$REPO/git/ref/heads/$b" --jq .object.sha 2>/dev/null || true)"
            if [ -z "$sha" ]; then
              echo "uebersprungen (existiert nicht): $b"
              continue
            fi

            echo "loesche $b (SHA $sha)"
            gh api -X DELETE "repos/$REPO/git/refs/heads/$b"
            echo "  wiederherstellbar mit: git push origin $sha:refs/heads/$b"
          done

          echo
          echo "Verbleibende Branches:"
          gh api "repos/$REPO/branches?per_page=100" --jq '.[].name' | sort
